# Produção em VPS. Uso (na VPS): docker compose -f docker-compose.prod.yml up -d --build
# Variáveis em .env.prod (modelo em docs/deploy-vps.md). Guia completo: docs/deploy-vps.md
name: tinpet

x-env: &env
  env_file: .env.prod

services:
  postgres:
    image: postgres:17-alpine
    <<: *env
    environment:
      POSTGRES_USER: tinpet
      POSTGRES_DB: tinpet
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinpet"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  s3:
    image: rustfs/rustfs:1.0.2
    <<: *env
    volumes:
      - s3:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    <<: *env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "true"
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://s3:9000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    <<: *env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Build do front (opção "front na VPS"); vazio se o front ficar no Netlify
      - ./apps/web/dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

  # Backup diário do Postgres com retenção (BACKUP_RETENTION_DAYS)
  backup:
    image: postgres:17-alpine
    <<: *env
    environment:
      PGHOST: postgres
      PGUSER: tinpet
      PGDATABASE: tinpet
    entrypoint: ["sh", "/scripts/backup.sh"]
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres:
  s3:
  caddy_data:
  caddy_config:
