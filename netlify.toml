# Front (apps/web) no Netlify. Guia: docs/deploy-gratuito.md
[build]
  # Roda na raiz do monorepo (pnpm workspace)
  command = "pnpm --filter @tinpet/web build"
  publish = "apps/web/dist"
  # Plano grátis: cada deploy de produção gasta créditos; pula o build se o front não mudou
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/web packages/shared pnpm-lock.yaml netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  # Não instala hooks de git no servidor de build
  LEFTHOOK = "0"

# API no Render pela mesma origem (o cookie de sessão fica first-party).
# Serviço "tinpet-api" no Render (render.yaml).
[[redirects]]
  from = "/api/*"
  to = "https://tinpet-api.onrender.com/api/:splat"
  status = 200
  force = true

# Arquivo de build inexistente (aba com versão antiga) deve dar 404, não o index.html:
# assim o app detecta o erro e recarrega para a versão nova
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# SPA: qualquer outra rota cai no index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
